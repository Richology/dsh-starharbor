name: Update public candidates

on:
  workflow_dispatch:
  schedule:
    # Shanghai 00:02: an endpoint is accepted only if the job really samples within ±5 minutes.
    - cron: '2 16 * * *'
    # Refresh before the morning board and throughout the day; Actions can start late.
    - cron: '17 0,4,8,12,20 * * *'

permissions:
  contents: write

concurrency:
  group: starharbor-public-candidates
  cancel-in-progress: false

jobs:
  collect:
    # Forks must explicitly opt in by removing this condition and configuring their own feed URL.
    if: github.repository == 'Richology/dsh-starharbor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and publish public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-cloud.mjs
